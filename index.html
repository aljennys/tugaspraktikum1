<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Test Vercel - Al Zena Ismail</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%);
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(233, 30, 99, 0.18), 0 5px 15px rgba(255, 255, 255, 0.4) inset;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #ff4081, #ff80ab);
      color: white;
      padding: 7px 18px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 22px;
      box-shadow: 0 4px 12px rgba(255, 64, 129, 0.35);
    }

    h1 {
      color: #880e4f;
      font-size: 24px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    p.description {
      color: #ad1457;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .identity-box {
      background: rgba(255, 240, 245, 0.95);
      border: 2px dashed #f48fb1;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 20px;
      color: #880e4f;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.3px;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid #f8bbd0;
      border-radius: 14px;
      padding: 12px;
      color: #c2185b;
      font-size: 13.5px;
      font-weight: 500;
    }

    .info-box span {
      display: block;
      margin-top: 4px;
      font-weight: 700;
      font-size: 14px;
      color: #880e4f;
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: #f48fb1;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">🚀 Vercel Web Test</div>
    
    <h1>Deployment Web Statis Berhasil!</h1>
    <p class="description">Website ini berjalan di atas platform Vercel.</p>

    <div class="identity-box">
      Al Zena Ismail - 102042400131
    </div>

    <div class="info-box">
      Waktu Sekarang:
      <span id="timestamp">Memuat waktu...</span>
    </div>

    <footer>
      Tugas Praktikum Komputasi Awan
    </footer>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      const options = { 
        day: '2-digit', 
        month: '2-digit', 
        year: 'numeric', 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit' 
      };
      document.getElementById('timestamp').innerText = now.toLocaleString('id-ID', options).replace(/\./g, ':');
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>

</body>
</html>
